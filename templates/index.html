<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Road Damage Detection AI</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:
            linear-gradient(
                135deg,
                #081120,
                #0f172a
            );

            min-height:100vh;
            color:white;
            padding:40px;
        }

        .container{

            width:95%;
            max-width:1400px;
            margin:auto;

            background:#101b35;

            border-radius:30px;

            padding:40px;

            box-shadow:
            0 0 40px rgba(0,255,100,0.15);
        }

        h1{

            text-align:center;

            font-size:65px;

            color:#00ff66;

            margin-bottom:15px;
        }

        .subtitle{

            text-align:center;

            font-size:24px;

            color:#d6d6d6;

            margin-bottom:40px;
        }

        .upload-section{

            border:3px dashed #00ff66;

            border-radius:25px;

            padding:60px;

            text-align:center;

            background:#15213d;

            margin-bottom:40px;
        }

        input[type="file"]{

            font-size:20px;

            color:white;

            margin-bottom:25px;
        }

        button{

            background:#00cc55;

            color:white;

            border:none;

            padding:18px 45px;

            font-size:24px;

            border-radius:15px;

            cursor:pointer;

            transition:0.3s;
        }

        button:hover{

            background:#00ff66;

            transform:scale(1.05);
        }

        .output-section{

            margin-top:50px;

            text-align:center;
        }

        .output-section h2{

            font-size:50px;

            margin-bottom:25px;

            color:#00ff66;
        }

        video{

            width:100%;

            max-height:750px;

            border-radius:25px;

            border:5px solid #00ff66;

            background:black;
        }

        img{

            width:100%;

            border-radius:25px;

            border:5px solid #00ff66;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Road Damage Detection AI</h1>

        <div class="subtitle">
            AI-powered pothole and crack detection system
            using YOLOv8 and OpenCV
        </div>

        <div class="upload-section">

            <form method="POST"
                  enctype="multipart/form-data">

                <input
                    type="file"
                    name="file"
                    accept="image/*,video/*"
                    required>

                <br><br>

                <button type="submit">
                    Upload & Detect
                </button>

            </form>

        </div>

        {% if output_image %}

        <div class="output-section">

            <h2>Detection Output</h2>

            <img src="{{ output_image }}">

        </div>

        {% endif %}

        {% if output_video %}

        <div class="output-section">

            <h2>Detection Output</h2>

            <video controls autoplay>

                <source
                    src="{{ output_video }}"
                    type="video/mp4">

            </video>

        </div>

        {% endif %}

    </div>

</body>

</html>

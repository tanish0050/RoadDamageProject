<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Road Damage Detection AI</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:
            linear-gradient(
                135deg,
                #081120,
                #0f172a
            );

            min-height:100vh;

            color:white;

            padding:40px;
        }

        .container{

            width:95%;

            max-width:1400px;

            margin:auto;

            background:#101b35;

            border-radius:30px;

            padding:40px;

            box-shadow:
            0 0 40px rgba(0,255,100,0.15);
        }

        h1{

            text-align:center;

            font-size:70px;

            color:#00ff66;

            margin-bottom:15px;
        }

        .subtitle{

            text-align:center;

            font-size:24px;

            color:#d6d6d6;

            margin-bottom:40px;
        }

        .top-bar{

            display:flex;

            justify-content:space-around;

            align-items:center;

            background:#1b2947;

            padding:25px;

            border-radius:20px;

            margin-bottom:40px;

            flex-wrap:wrap;
        }

        .info{

            text-align:center;

            margin:10px;
        }

        .info h2{

            color:#00ff66;

            margin-bottom:8px;
        }

        .info p{

            font-size:22px;

            font-weight:bold;
        }

        .upload-section{

            border:3px dashed #00ff66;

            border-radius:25px;

            padding:60px;

            text-align:center;

            background:#15213d;

            margin-bottom:40px;
        }

        input[type="file"]{

            font-size:20px;

            color:white;

            margin-bottom:25px;
        }

        button{

            background:#00cc55;

            color:white;

            border:none;

            padding:18px 45px;

            font-size:24px;

            border-radius:15px;

            cursor:pointer;

            transition:0.3s;
        }

        button:hover{

            background:#00ff66;

            transform:scale(1.05);
        }

        .cards{

            display:flex;

            gap:20px;

            margin-top:50px;

            flex-wrap:wrap;
        }

        .card{

            flex:1;

            min-width:250px;

            background:#1b2947;

            padding:30px;

            border-radius:20px;

            text-align:center;
        }

        .card h3{

            color:#00ff66;

            font-size:30px;

            margin-bottom:10px;
        }

        .card p{

            color:#d8d8d8;

            font-size:20px;
        }

        .note{

            margin-top:35px;

            text-align:center;

            color:#cccccc;

            font-size:18px;
        }

        @media(max-width:900px){

            h1{
                font-size:45px;
            }

            .subtitle{
                font-size:18px;
            }

            button{
                width:100%;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Road Damage Detection AI</h1>

        <div class="subtitle">
            AI-powered pothole and crack detection system
            using YOLOv8 and OpenCV
        </div>

        <div class="top-bar">

            <div class="info">
                <h2>Date</h2>
                <p id="date"></p>
            </div>

            <div class="info">
                <h2>Time</h2>
                <p id="clock"></p>
            </div>

            <div class="info">
                <h2>Status</h2>
                <p>ACTIVE</p>
            </div>

        </div>

        <div class="upload-section">

            <form method="POST"
                  enctype="multipart/form-data">

                <input
                    type="file"
                    name="file"
                    accept="image/*,video/*"
                    required>

                <br><br>

                <button type="submit">
                    Upload & Detect
                </button>

            </form>

            <div class="note">
                Supported Formats:
                JPG, PNG, JPEG, MP4, AVI
            </div>

        </div>

        <div class="cards">

            <div class="card">
                <h3>YOLOv8</h3>
                <p>
                    Real-time road damage detection
                </p>
            </div>

            <div class="card">
                <h3>OpenCV</h3>
                <p>
                    Video & image frame processing
                </p>
            </div>

            <div class="card">
                <h3>AI Monitoring</h3>
                <p>
                    Smart road crack analysis
                </p>
            </div>

        </div>

    </div>

    <script>

        function updateDateTime(){

            const now = new Date();

            document.getElementById("clock").innerHTML =
                now.toLocaleTimeString();

            document.getElementById("date").innerHTML =
                now.toLocaleDateString();
        }

        setInterval(updateDateTime,1000);

        updateDateTime();

    </script>

</body>

</html>

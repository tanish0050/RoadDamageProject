<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Road Damage Detection AI</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#0f172a;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
        }

        .background{
            position:absolute;
            width:100%;
            height:100%;

            background:
            radial-gradient(circle at top left,#22c55e33,transparent 25%),
            radial-gradient(circle at bottom right,#3b82f633,transparent 25%);

            z-index:0;
        }

        .container{

            position:relative;
            z-index:1;

            width:90%;
            max-width:850px;

            background:rgba(255,255,255,0.05);

            border:1px solid rgba(255,255,255,0.1);

            backdrop-filter:blur(15px);

            border-radius:25px;

            padding:50px;

            text-align:center;

            box-shadow:0 0 40px rgba(0,0,0,0.4);
        }

        h1{
            color:white;
            font-size:42px;
            margin-bottom:15px;
        }

        .subtitle{
            color:#cbd5e1;
            font-size:18px;
            margin-bottom:35px;
            line-height:1.6;
        }

        .info-bar{

            display:flex;
            justify-content:space-between;
            align-items:center;

            background:rgba(255,255,255,0.05);

            border:1px solid rgba(255,255,255,0.08);

            padding:15px 25px;

            border-radius:15px;

            margin-bottom:30px;

            color:white;

            flex-wrap:wrap;
        }

        .info-box{
            margin:10px;
        }

        .info-title{
            color:#22c55e;
            font-size:14px;
            margin-bottom:5px;
        }

        .info-value{
            font-size:18px;
            font-weight:bold;
        }

        .upload-box{

            border:2px dashed #22c55e;

            border-radius:20px;

            padding:50px 20px;

            background:rgba(255,255,255,0.03);

            transition:0.3s;
        }

        .upload-box:hover{
            transform:scale(1.02);
            background:rgba(255,255,255,0.05);
        }

        input[type="file"]{
            color:white;
            margin-bottom:25px;
            font-size:16px;
        }

        button{

            padding:15px 35px;

            border:none;

            border-radius:12px;

            background:linear-gradient(
                135deg,
                #22c55e,
                #16a34a
            );

            color:white;

            font-size:18px;

            font-weight:bold;

            cursor:pointer;

            transition:0.3s;
        }

        button:hover{

            transform:translateY(-3px);

            box-shadow:0 10px 20px rgba(34,197,94,0.3);
        }

        .features{

            display:grid;

            grid-template-columns:repeat(3,1fr);

            gap:15px;

            margin-top:40px;
        }

        .feature-card{

            background:rgba(255,255,255,0.05);

            padding:18px;

            border-radius:15px;

            color:white;

            border:1px solid rgba(255,255,255,0.08);
        }

        .feature-card h3{
            color:#22c55e;
            margin-bottom:8px;
        }

        @media(max-width:768px){

            .features{
                grid-template-columns:1fr;
            }

            .info-bar{
                flex-direction:column;
            }

            h1{
                font-size:32px;
            }

            .container{
                padding:30px;
            }
        }

    </style>

</head>

<body>

    <div class="background"></div>

    <div class="container">

        <h1>Road Damage Detection AI</h1>

        <p class="subtitle">
            AI-powered pothole and crack detection system using
            YOLOv8 and OpenCV for smart road monitoring.
        </p>

        <div class="info-bar">

            <div class="info-box">
                <div class="info-title">Current Date</div>
                <div class="info-value" id="date"></div>
            </div>

            <div class="info-box">
                <div class="info-title">Current Time</div>
                <div class="info-value" id="time"></div>
            </div>

            <div class="info-box">
                <div class="info-title">System Status</div>
                <div class="info-value">ACTIVE</div>
            </div>

        </div>

        <form method="POST" enctype="multipart/form-data">

            <div class="upload-box">

                <input
                    type="file"
                    name="video"
                    accept="video/*"
                    required>

                <br>

                <button type="submit">
                    Upload & Detect
                </button>

            </div>

        </form>

        <div class="features">

            <div class="feature-card">
                <h3>YOLOv8</h3>
                <p>Real-time AI damage detection</p>
            </div>

            <div class="feature-card">
                <h3>OpenCV</h3>
                <p>Live video frame processing</p>
            </div>

            <div class="feature-card">
                <h3>GPS Logging</h3>
                <p>Road damage location tracking</p>
            </div>

        </div>

    </div>

    <script>

        function updateDateTime(){

            const now = new Date();

            const dateOptions = {
                year:'numeric',
                month:'long',
                day:'numeric'
            };

            const timeOptions = {
                hour:'2-digit',
                minute:'2-digit',
                second:'2-digit'
            };

            document.getElementById("date").innerHTML =
                now.toLocaleDateString(undefined,dateOptions);

            document.getElementById("time").innerHTML =
                now.toLocaleTimeString(undefined,timeOptions);
        }

        setInterval(updateDateTime,1000);

        updateDateTime();

    </script>

</body>

</html>
